# Analysis pipeline (core/pipeline.py, docs/PIPELINE.md): every threshold of the per-sample analysis.
# These are starting values to calibrate. Do not edit this file: copy the lines you change to
# config/analysis.toml (local, ignored by git); it is merged over this one key by key.
# Steering is in steering-wheel degrees, slip angles in degrees, slip ratios as shares (-0.15 = -15 %),
# accelerations in g, times in seconds, distances in metres, speeds in km/h.

config_version = 1

[pipeline]
hz = 30                     # samples per second written (the bridge reads faster; extra frames are skipped)
queue_size = 600            # frames the worker may lag behind; when full, the oldest frame is dropped (counted)
session_idle_s = 120        # no live data for this long ends the session (and finalizes it)
gap_s = 0.5                 # a gap this long inside a lap (pause, stutter) keeps the lap from being the reference
steer_deg_per_unit = 240    # steering-wheel degrees for full steering (1.0) when the game sends no degrees

[smoothing]
window_s = 0.05             # moving average over this window before any rule looks at a signal

[envelope]
percentile = 0.98           # the grip envelope g_max(v) is this percentile of combined g ...
bin_kmh = 10                # ... in speed bins of this width, separately for braking / cornering / traction
min_samples = 30            # a bin with fewer samples borrows from its neighbours
resolution_g = 0.01         # histogram step

[phase]
min_s = 0.10                # a phase must last this long, else the samples keep the phase before
brake_on = 0.05             # brake above this = braking or entry
straight_steer_deg = 5.0    # braking: steering below this
entry_throttle_max = 0.2    # entry also: throttle below this while slowing to the next speed minimum
apex_lat_share = 0.7        # apex: lateral g above this share of the cornering envelope ...
apex_throttle_max = 0.3     # ... with little throttle ...
apex_brake_max = 0.05       # ... and no brake
full_throttle = 0.95        # straight: throttle above this ...
straight_steer_max_deg = 3.0  # ... and steering below this
min_rise_kmh = 2.0          # a speed minimum counts when the speed falls and rises by at least this around it

[corners]
lat_share = 0.4             # a corner (on the reference lap): lateral g above this share of the cornering envelope ...
merge_m = 20.0              # ... with gaps shorter than this joined ...
min_m = 20.0                # ... and at least this long; it starts where the braking / entry before it starts
lead_max_m = 200.0          # at most this far before the cornering itself

[braking]
buildup_good_s = 0.15       # brake pressure to 90 % of its peak within this: good; slower: potential
envelope_good = 0.95        # deceleration at least this share of the braking envelope: good
envelope_bad = 0.85         # below this: bad; between: potential
abs_good_max = 0.30         # ABS working at most this share of the braking phase: good
abs_potential_min = 0.70    # more than this: potential
point_potential_m = 5.0     # braking point more than this off the reference: potential
early_bad_m = 10.0          # braking this much earlier than the reference without a higher minimum speed: bad
lockup_ratio = -0.15        # a wheel slower than this ...
lockup_s = 0.10             # ... for this long: lock-up, bad
overlap_throttle = 0.10     # throttle and brake both above these: pedal overlap, bad
overlap_brake = 0.10
overlap_s = 0.10
double_drop = 0.20          # brake released by this much and pressed again in one braking: double braking, bad

[entry]
grip_use_good_low = 0.95    # trail braking with grip use U in this window: good
grip_use_good_high = 1.03
grip_use_potential_low = 0.85  # U between this and the good window: potential
balance_good_deg = 0.5      # |front - rear slip angle| up to this: good
balance_bad_deg = 1.5       # above this: bad; between: potential
dead_zone_low_s = 0.1       # no pedal for 0.1-0.3 s: potential
coast_bad_s = 0.3           # longer: coasting, bad
reversals_bad = 2           # this many steering reversals in one entry: bad
trail_min_s = 0.10          # brake and steering together at least this long counts as trail braking

[apex]
vmin_good_kmh = 1.0         # minimum speed at most this below the reference: good
vmin_bad_kmh = 3.0          # more than this below (with low grip use): bad; between: potential
grip_use_good = 0.95        # U at least this: good
grip_use_bad = 0.88         # below this: bad (with a slow minimum); between: potential
steer_rate_good_dps = 20.0  # steering calm: rate below this
two_minima_kmh = 2.0        # two speed minima in one corner, separated by a rise of at least this: bad

[exit]
rear_slip_good_low = 0.03   # rear slip ratio on exit in this window: good (traction used)
rear_slip_good_high = 0.08
rear_slip_bad = 0.12        # above this ...
wheelspin_s = 0.10          # ... for this long: wheelspin, bad; 0.08-0.12: potential
dip = 0.10                  # one throttle dip of this much: potential
lift_bad = 0.30             # a throttle lift of this much: bad
tc_potential_s = 0.2        # TC working longer than this: potential
tc_bad_s = 0.5              # longer than this: bad
full_late_low_m = 5.0       # full throttle this much later than the reference: potential ...
full_late_high_m = 15.0     # ... up to this; later: still potential (the reference may differ)
unused_traction_s = 0.3     # rear slip below the good window with the throttle not full for this long: potential
steer_added_deg = 5.0       # steering added by this much while on throttle: bad
steer_added_throttle = 0.5
countersteer_balance_deg = -1.0  # counter-steering with balance below this (oversteer): bad

[straight]
throttle_good = 0.98        # throttle at least this on the straight: good
shift_good_rpm = 150        # upshift within this of the shift signal: good
shift_potential_rpm = 400   # 150-400 rpm off: potential; more: potential too (noted)
partial_low = 0.10          # straight steering with the throttle between these ...
partial_high = 0.95
partial_s = 0.5             # ... for this long, not followed by braking: partial throttle, bad
limiter_s = 0.10            # rev limiter on longer than this: bad

[transition]
coast_good_s = 0.1          # no pedal shorter than this: good
coast_bad_s = 0.3           # longer: bad; between: potential

[all]
wheels_out_bad = 2          # more wheels out than this: bad
invalid_window_s = 0.5      # the samples this close to the moment the lap became invalid: bad
