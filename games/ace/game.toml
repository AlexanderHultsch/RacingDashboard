# Assetto Corsa EVO (PC). Reads the game's shared memory, sends buttons as keypresses.
# Do not edit for your own key changes: put overrides in config/config.toml under [games.ace.keys].

[game]
name = "Assetto Corsa EVO"

[window]
# The game window gets the keypresses; the core brings it to the front if needed.
process = "AssettoCorsaEVO.exe"
title = "Assetto Corsa EVO"

# Action -> key combo. Modifiers and key joined by "+": LCtrl RCtrl LShift RShift LAlt RAlt,
# A-Z, 0-9, F1-F12, Num0-Num9, NumPlus, NumMinus, NumMultiply, NumDivide, NumEnter, NumDecimal,
# Esc, Tab, Space, Enter, Backspace, Home, End, PageUp, PageDown, Insert, Delete, Up, Down, Left, Right,
# Minus, Equals, LBracket, RBracket, Semicolon, Apostrophe, Grave, Backslash, Comma, Period, Slash.
# Empty = no key, the button is greyed out.
#
# ACE has no keyboard defaults for the car controls (first test, Nov 2026), so every key below is a
# proposal you bind once in ACE (Options > Controls > Car). The full list with the exact ACE names,
# and what to check after binding: docs/ACE/KEYS.md. Plain keys, no Ctrl / Shift.
[keys]
tc_down = "Num7"                  # Traction Control Cycle -
tc_up = "Num8"                    # Traction Control Cycle +
tc_cut_down = "Num4"              # Traction Control Cut Cycle -
tc_cut_up = "Num5"                # Traction Control Cut Cycle +
abs_down = "Num1"                 # ABS Cycle -
abs_up = "Num2"                   # ABS Cycle +
esc_down = "Num0"                 # ESC Cycle -
esc_up = "NumDecimal"             # ESC Cycle +
map_down = "NumMinus"             # Engine Map Cycle -
map_up = "NumPlus"                # Engine Map Cycle +
bias_rear = "NumDivide"           # Brake Bias Rear
bias_front = "NumMultiply"        # Brake Bias Front
pit_limiter = "Insert"            # Pit Limiter Toggle
lights = "Home"                   # Light Cycle +
flash = "PageUp"                  # Flashing Lights (held)
wipers = "Delete"                 # Wiper Cycle +
ignition = "End"                  # Toggle Ignition
starter = "PageDown"              # Starter (held)
indicator_left = "Comma"          # Left Direction Indicator
indicator_right = "Period"        # Right Direction Indicator
hazards = "Slash"                 # Hazard Lights
horn = "Backslash"                # Horn
display = "NumEnter"              # Display Page Cycle +
# Other tabs, not checked in ACE yet: guesses from the original Assetto Corsa ("AC") or proposals ("set").
camera = "F1"                     # AC
hud = "LCtrl+LShift+U"            # set
mirror = "F8"                     # AC (virtual mirror)
look_left = "Q"                   # AC
look_back = "LCtrl+LShift+K"      # set
look_right = "W"                  # AC
leaderboard = "F7"                # AC
pause = "Esc"
auto_shifter = "LCtrl+L"          # AC
shift_down = "Z"                  # AC
shift_up = "X"                    # AC
neutral = ""
save_replay = ""
