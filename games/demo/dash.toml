# The iPad dash box (page DASH) for the demo car. The same cards as Assetto Corsa EVO, so the page
# can be tried without the game; the demo car has no stability control (the card is greyed out).
#
# One [[control]] per card, in this order. The page looks the same for every car of this game;
# a card whose value the car does not have (empty value from the game) is greyed out.
#
# type = "stepper"   a setting in steps: big value, level dots, - / + buttons
#                    field (the value), down / up (actions); the range comes from the game
# type = "bias"      brake bias in % front: field, front / rear (actions); hold a button to repeat
# type = "toggle"    a switch: field (true / false), action (leave out: shows the state only),
#                    on / off (texts), style = "amber" (lights up when on) or "green" (calm state)
# type = "pair"      two values side by side, shown only: fields, labels
# type = "fuel"      fuel in litres with a tank bar: field, max (full tank), per_lap (laps left)
# type = "lamps"     warning lamps, state only (grey off, blue cold, yellow warning, red alert):
#                    fields, icons (brake, engine, oil, coolant), labels
# type = "cycle"     a setting that steps on with one button (lights, wipers): field (0 = off),
#                    action (next stage), names (optional, one text per stage), extra / extra_label
#                    (optional second button, e.g. headlight flash; a "hold" action is held while pressed)
# type = "ignition"  ignition and starter: field (ignition on), running (engine running),
#                    action (ignition, held while pressed: a short touch is a tap), starter (held while pressed)
# type = "tyres"     tyres and brakes, front left / right, rear left / right: field (tyre temperatures C, the tile),
#                    pressure (psi, above / below), cold / hot (C: below cold blue, above hot red, between green),
#                    brakes (brake temperatures C: a bar beside each tyre, its colour by brake_cold / brake_hot)
# type = "mode"      a drive / performance mode: field (the step), name (the game's name for it), down / up
# active             (stepper) a field that is true while the system works: the digits light amber
# label              card title;  hint: small text at the bottom of the card
#
# Actions are the names of core/actions.py; their keys are in [keys] of game.toml.

[[control]]
type = "stepper"
label = "TC"
active = "tc_active"
field = "tc_level"
down = "tc_down"
up = "tc_up"

[[control]]
type = "stepper"
label = "TC CUT"
active = "tc_active"
field = "tc_cut_level"
down = "tc_cut_down"
up = "tc_cut_up"

[[control]]
type = "stepper"
label = "ABS"
active = "abs_active"
field = "abs_level"
down = "abs_down"
up = "abs_up"

[[control]]
type = "stepper"
label = "STABILITY"
active = "esc_active"
field = "esc_level"
down = "esc_down"
up = "esc_up"

[[control]]
type = "stepper"
label = "ENGINE MAP"
field = "engine_map"
down = "map_down"
up = "map_up"

[[control]]
type = "bias"
label = "BRAKE BIAS"
field = "brake_bias"
front = "bias_front"
rear = "bias_rear"

[[control]]
type = "fuel"
label = "FUEL"
field = "fuel_l"
max = "fuel_max_l"
per_lap = "fuel_per_lap_l"

[[control]]
type = "pair"
label = "DIFF"
fields = ["diff_power", "diff_coast"]
labels = ["POWER", "COAST"]

[[control]]
type = "toggle"
label = "PIT LIMITER"
field = "pit_limiter"
action = "pit_limiter"
on = "ON"
off = "OFF"
style = "amber"

[[control]]
type = "cycle"
label = "LIGHTS"
field = "lights"
action = "lights"
extra = "flash"
extra_label = "FLASH"

[[control]]
type = "cycle"
label = "WIPERS"
field = "wipers"
action = "wipers"

[[control]]
type = "ignition"
label = "IGNITION"
field = "ignition"
running = "engine_running"
action = "ignition"
starter = "starter"

[[control]]
type = "lamps"
label = "WARNINGS"
fields = ["warn_brake", "warn_engine", "warn_oil", "warn_coolant"]
icons = ["brake", "engine", "oil", "coolant"]
labels = ["BRAKE", "ENGINE", "OIL", "TEMP"]

[[control]]
type = "tyres"
label = "TYRES"
field = "tyre_temp_c"
pressure = "tyre_psi"
cold = 70
hot = 100
brakes = "brake_temp_c"
brake_cold = 150
brake_hot = 650

[[control]]
type = "mode"
label = "DRIVE MODE"
field = "drive_mode"
name = "drive_mode_name"
down = "drive_mode_down"
up = "drive_mode_up"
