<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Analysis">
<meta name="theme-color" content="#07090b">
<link rel="apple-touch-icon" href="/racing-dashboard-icon.png">
<title>Analysis</title>
<link rel="stylesheet" href="css/base.css">
<link id="rd-style" rel="stylesheet" href="styles/analysis/standard.css">
</head>
<!-- Analysis: where the time goes, section by section (docs/ANALYSIS.md). The bridge records the laps
     (core/recorder.py); this page shows the map with the sections on the left and the graphs of one
     section on the right: green = best (baseline), blue = last lap, red = the lap now. -->
<body data-page="analysis" data-styles="standard">
<main class="an">
  <header class="bar">
    <span class="title">ANALYSIS</span>
    <span class="what" id="what">WAITING FOR THE GAME</span>
    <span class="right">
      <button class="btn live on" id="live"><i></i>LIVE</button>
      <button class="btn" id="end">END RUN</button>
    </span>
  </header>
  <section class="deltas">
    <div class="dl"><span>LAP · VS BEST EVER</span><b id="d-lap-best">-</b></div>
    <div class="dl"><span>LAP · VS LAST</span><b id="d-lap-last">-</b></div>
    <div class="dl"><span id="d-sec-best-t">SECTION · VS BEST</span><b id="d-sec-best">-</b></div>
    <div class="dl"><span id="d-sec-last-t">SECTION · VS LAST</span><b id="d-sec-last">-</b></div>
  </section>
  <section class="main">
    <div class="card mapcard">
      <div class="mapwrap"><canvas id="map"></canvas><button class="btn ai off" id="ai" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9zM18.5 14l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9zM6 15l.7 1.8 1.8.7-1.8.7L6 20l-.7-1.8-1.8-.7 1.8-.7z"/></svg>AI TRAINER<small id="ai-what">-</small></button></div>
      <button class="btn back" id="back" hidden>&lsaquo; BACK</button>
      <span class="tag" id="map-tag">OVERVIEW</span>
      <span class="legend"><span><i class="best"></i>BEST</span><span><i class="last"></i>LAST</span><span><i class="now"></i>NOW</span></span>
      <div class="strip">
        <div class="cells" id="cells"></div>
        <input type="range" id="slider" min="0" max="100" value="0" aria-label="Scroll the sections">
      </div>
    </div>
    <div class="card side">
      <div class="tabs">
        <button class="tab on" data-tab="review">REVIEW <b id="tab-n">0</b></button>
        <button class="tab" data-tab="graphs">GRAPHS</button>
        <button class="tab" data-tab="trainer">TRAINER</button>
      </div>
      <div class="pane review" id="pane-review">
        <div class="rv-head"><span>NOTHING IS SAVED WITHOUT A TAP</span><span class="rv-all"><button class="sbtn" id="skip-all">SKIP ALL</button><button class="sbtn save" id="save-all">SAVE ALL</button></span></div>
        <div class="rv-list" id="offers"></div>
        <div class="undo" id="undo" hidden><span>Last saved: <b id="undo-label"></b> · previous baseline kept</span><button class="sbtn" id="undo-btn">UNDO</button></div>
      </div>
      <div class="pane trainer" id="pane-trainer" hidden></div>
      <div class="pane graphs" id="pane-graphs" hidden>
        <div class="gh"><b id="g-title">SECTION -</b><span id="g-sub">-</span></div>
        <div class="gbox"><div class="gwrap" id="gwrap"><div class="gpages" id="gpages"></div><canvas id="graphs"></canvas></div><div class="gdots" id="gdots"></div></div>
      </div>
    </div>
  </section>
</main>
<div class="overlay" id="overlay" hidden></div>
<div class="modal" id="modal" hidden>
  <h2>RUN ENDED</h2>
  <div class="sub" id="m-sub"></div>
  <div class="stats">
    <div><span>LAPS</span><b id="m-laps">-</b></div>
    <div><span>BEST LAP</span><b id="m-best">-</b></div>
    <div><span>TO REVIEW</span><b id="m-open">-</b></div>
    <div><span>LAP FILES</span><b id="m-mb">-</b></div>
  </div>
  <div class="m-open" id="m-open-h"><h4>STILL TO REVIEW</h4><span class="rv-all"><button class="sbtn" id="m-skip-all">SKIP ALL</button><button class="sbtn save" id="m-save-all">SAVE ALL</button></span></div>
  <div class="m-offers" id="m-offers"></div>
  <div class="choice">
    <button class="big" id="keep-all">KEEP ALL LAPS<small id="keep-all-s"></small></button>
    <button class="big warn" id="keep-base">KEEP BASELINES ONLY<small id="keep-base-s"></small></button>
  </div>
</div>
<div class="rd-nodata"></div>
<script src="js/rd.js"></script>
<script src="js/analysis.js"></script>
<script>
  RD.start();
  RD.loadInfo();
  RD.analysis();
</script>
</body>
</html>
