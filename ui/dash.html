<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dash">
<meta name="theme-color" content="#07090b">
<link rel="apple-touch-icon" href="/racing-dashboard-icon.png">
<title>Dash</title>
<link rel="stylesheet" href="css/base.css">
<link id="rd-style" rel="stylesheet" href="styles/dash/cards.css">
</head>
<!-- Dash: the dash box for a tablet. The cards come from the active game's dash map
     (games/<game>/dash.toml): the same page for every car of a game, greyed cards for what a car lacks. -->
<body data-page="dash" data-styles="cards">
<main class="dashbox">
  <header class="bar">
    <span class="game" id="game">-</span>
    <span class="car" data-rd="car">-</span>
    <span class="status">
      <svg class="rd-seg mini-gear" data-field="gear" data-fmt="gearseg" aria-label="Gear"></svg>
      <span class="live"><i></i><b>LIVE</b></span>
    </span>
  </header>
  <section class="cards"></section>
</main>
<div class="rd-nodata"></div>
<script src="js/rd.js"></script>
<script src="js/seg14.js"></script>
<script src="js/dashbox.js"></script>
<script>
  RD.start();
  RD.loadInfo().then((info) => { document.getElementById("game").textContent = info.game_name.toUpperCase(); });
  RD.dashbox(document.querySelector(".cards"));
</script>
</body>
</html>
