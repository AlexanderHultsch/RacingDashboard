<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gear + Rev">
<meta name="theme-color" content="#050607">
<link rel="apple-touch-icon" href="/racing-dashboard-icon.png">
<title>Gear + Rev</title>
<link rel="stylesheet" href="css/base.css">
<link id="rd-style" rel="stylesheet" href="styles/gear/segment.css">
</head>
<!-- Gear + Rev: the page for a phone. 8 rev lights and the gear as a 14-segment display in a frame.
     A style (styles/gear/<name>.css) arranges these elements; add a style by adding a CSS file and
     its name to data-styles. -->
<body data-page="gear" data-styles="segment">
<main class="gear-page">
  <div class="rd-revlights" data-colors="b g y r r y g b" data-fill="outside" data-range="0.25"></div>
  <div class="gear-area">
    <div class="gear-frame">
      <svg class="rd-seg gear-digit" data-field="gear" data-fmt="gearseg" role="img" aria-label="Gear"></svg>
    </div>
    <div class="gear-label"><svg class="rd-seg-text" data-text="GEAR" aria-hidden="true"></svg></div>
  </div>
</main>
<div class="rd-nodata"></div>
<script src="js/rd.js"></script>
<script src="js/seg14.js"></script>
<script>
  // the display has one digit: gears above 9 show E (the rev lights keep working)
  RD.notices.push((f) => (Number.isInteger(f.gear) && f.gear > 9 && RD.formats.gear(f.gear, f) === String(f.gear)
    ? "GEAR " + f.gear + ": THE DISPLAY SHOWS ONE DIGIT" : null));
  RD.start();
</script>
</body>
</html>
