<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Map">
<meta name="theme-color" content="#050607">
<link rel="apple-touch-icon" href="/racing-dashboard-icon.png">
<title>Map</title>
<link rel="stylesheet" href="css/base.css">
<link id="rd-style" rel="stylesheet" href="styles/map/track.css">
</head>
<!-- Map: the page for a phone. The whole track, fitted to the screen (not zoomed), with a red dot where the car
     is. The track comes from the analysis recorder (best lap, else the last lap or the lap so far), the dot from
     the live position. In a frame like the gear, boost and grip pages. Drawn by js/map.js. -->
<body data-page="map" data-styles="track">
<main class="map-page">
  <div class="map-frame">
    <div class="rd-map"></div>
    <div class="map-label"><svg class="rd-seg-text" data-text="MAP" aria-hidden="true"></svg></div>
  </div>
</main>
<div class="rd-nodata"></div>
<script src="js/rd.js"></script>
<script src="js/seg14.js"></script>
<script src="js/map.js"></script>
<script>RD.start();</script>
</body>
</html>
